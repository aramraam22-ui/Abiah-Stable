  <body>
    <br><br>
    <p>Please fill the required information below to schedule an appointmnet : </p>
    <form action="action_page.php" method="post">

      <h2>Basic Information About Appointment:</h2>
      <label for="date" class="required">Schedule an appointment date:</label><br>
      <input type="date" id="date" name="AppointmentDay" required>
      <br><br>
      <label for="duration"  class="required" >Choose a Session Duration and Time:</label> <br>
      <input type="time" id="duration" name="duration" required> 
      <br><hr>

      <h2>Booking Type:</h2>
      <p>Type of Activity:</p>
      <input type="checkbox" id="train" name="activity[]" value="Training">
      <label for="train">Training</label>
      <input type="checkbox" id="riding" name="activity[]" value="RidingExperience">
      <label for="riding">Riding Experience</label>
      <input type="checkbox" id="pic" name="activity[]" value="Picturing">
      <label for="pic">Picturing</label>
      <input type="checkbox" id="other" name="activity[]" value="Other">
      <label for="other">Other</label>
      <br><br>
      <label for="NumOfPer" class="required">How Many People?</label><br>
      <input type="number" id="NumOfPer" name="NumberOfPersons" min="1" required>
      <br><hr>

      <label for= "coach" class="required">Select a Coach:</label><br>
   <select id="coach" name="Coach" required>
   <option value="Ahmad">Coach Ahmad </option>
   <option value="Reem">Coach Reem  Al-Bahr</option>
   <option value="Khaled">Coach Khaled Al-Najm</option>>
   </select>
      <br><br>

      <label for="notes">Comments:</label><br>
      <textarea id="notes" name="comments" rows="2" cols="30" placeholder="comments"></textarea>
      <br><br>

      <input type="checkbox" id="termsAndPolicies" name="Terms" required>
      <label for="termsAndPolicies" class="required">I agree to the Terms and Policies</label>
      <br><br>
     
      <input class = buttonColor type="submit" value="Book" >
      <input class = buttonColor type="reset" value="Clear">

    </form>
