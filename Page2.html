<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Abieh Stable</title>
<style>
body {
  font-family:"Open Sans", sans-serif ;
  background: url('p1.jpg') center/cover no-repeat;
  margin: 0;
  padding: 0;
  line-height: 1.5; /*  المسافة بينن الاسطر */ 

}

.form-box {
  width: 480px;
  margin: 50px auto;
  color:#efb35f;
  background-color: #ffffff  ; 
  padding: 20px;
  border-radius: 8px;
  border: 1px solid lightgray;
}

h2 {
  text-align: center;
  font-family:"Open Sans", sans-serif;
  color:#efb35f;
  margin: 20px 0 10px;
  font-size: 40px;
}

.note-text {
  font-size: 14px;
  color: black;
  margin-bottom: 10px;
}

label {
  font-size: 14px;
  color: black;
  display: block;
  margin-top: 8px;
  margin-bottom: 3px;
  font-weight: bold;
}

input[type=text],input[type=number],input[type=date],input[type=email],textarea,select {
  width: 100%;
  padding: 7px;
  border: 1px solid lightgray;
  border-radius: 4px;
  font-size: 14px;
  box-sizing: border-box;
  margin-bottom: 8px;
}
input[type=submit]   {
  background: #c19a6b;
  color: white;
  margin-top: 10px;
  border-radius: 4px;
  font-size: 14px;
  padding: 8px;
  width: 48%;
  border: none;

}
input[type=reset]   {
  background: #c19a6b;
  color: white;
  margin-top: 10px;
  border-radius: 4px;
  font-size: 14px;
  padding: 8px;
  width: 48%;
  border: none;

}
.buttons{
  display: flex;
  justify-self: space-between;
  gap:4%;
}
input[type=submit]:hover {
  background:brown ;
}
input[type=reset]:hover {
  background:brown ;
}


</style>

</head>

<body>

<div class="form-box">
  <form method="post" action="action_page.php" >
    <h2>Abieh Stable</h2>

    <div class="note-text">please fill the required information below:</div>

    <label>Full name :</label>
    <input type="text" id="fullname" name="fullname" placeholder="ex: ali mohammed" required>

    <label>Age :</label>
    <input type="number" id="age" name="age" placeholder="ex:19" required>

    <label>Birth date :</label>
    <input type="date" name="birth" required>

    <label>Email:</label>
    <input type="email" name="email" placeholder="ex:x@gmail.com" required>

    <label>Phone number :</label>
    <input type="text" name="phone" placeholder="ex:0505...3" required>

    <label>Gender :</label>
    <div class="gender-row">
      <input type="radio" id="male" name="gender" value="Male" required>
      <label for="male" style="display:inline;font-weight:normal;">Male</label>

      <input type="radio" id="female" name="gender" value="Female">
      <label for="female" style="display:inline;font-weight:normal;">Female</label>
    </div>

    <label>Country:</label>
    <select name="country" required>
      <option value="Saudi Arabia">Saudi Arabia</option>
      <option value="Kuwait">Kuwait</option>
      <option value="Bahrain">Bahrain</option>
      <option value="Qatar">Qatar</option>
      <option value="Oman">Oman</option>
      <option value="United Arab Emirates">United Arab Emirates</option>
    </select>

    <label>City:</label>
    <input type="text" name="city" placeholder="ex:khobar" required>

    <label>Any Diseases (if any):</label>
    <textarea name="disease" placeholder="if there is no disease type nothing"></textarea>
<div class="buttons">


    <input type="submit" name="save" value="Next">
    <input type="reset" name ="delete" value="Go Back" >

</div>
  </form>

 

</body>
</html>
